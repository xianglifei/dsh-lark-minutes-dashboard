# dsh-lark-minutes-dashboard —— 妙记工作台
# 本地开发安装：
#   dsh plugin --profile desktop add link:<本目录绝对路径>
- insert:
    - id: dsh-lark-minutes-dashboard
      name: dsh-lark-minutes-dashboard
      config:
        pollIntervalSec: 60
        autoWriteTitle: true
        createDocs: true
        llmTimeoutMs: 180000
        # 发现窗口就是列表的可见范围（默认最近 7 天，已整理的记录不受窗口限制）
        searchWindowDays: 7
